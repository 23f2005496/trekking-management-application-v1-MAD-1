{% extends "layout.html" %}
{% block title %}My Profile{% endblock %}
{% block content %}
<h1 class="page-title">My Profile</h1>

<section class="mb-6">
    <div class="row gap-6">
        <div class="col">
            <div class="card">
                <div class="card-body">
                    <h2 class="mb-3">Your Details</h2>
                    <div class="detail-item">
                        <span class="detail-key">Email :</span>
                        <span class="detail-value">{{ current_user.email }}</span>
                    </div>

                    <div class="detail-item">
                        <span class="detail-key">Full Name :</span>
                        <span class="detail-value">{{ current_user.full_name }}</span>
                    </div>

                    <div class="detail-item">
                        <span class="detail-key">Contact :</span>
                        <span class="detail-value">{{ current_user.contact }}</span>
                    </div>

                    <div class="detail-item">
                        <span class="detail-key">Role :</span>
                        <span class="detail-value">{{ current_user.role }}</span>
                    </div>

                </div>
            </div>
        </div>
    </div>

</section>

<div>
    <a href="{{ url_for('trekker.update_profile') }}" class="btn btn-primary">Update Profile</a>
</div>

{% endblock %}
